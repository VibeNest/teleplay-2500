services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_tv}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - "CMD-SHELL"
      - "pg_isready -U postgres"
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - telegram-tv-network
    deploy:
      resources:
        limits:
          memory: '89478485'
          cpus: 0.166666
        reservations: {}
    mem_limit: 89478485
    memswap_limit: 89478485
    cpus: 0.166666
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telegram_tv}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_STORAGE_CHANNEL_ID: ${TELEGRAM_STORAGE_CHANNEL_ID}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-10080}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost}
    volumes:
    - telegram_session:/app/session
    networks:
    - telegram-tv-network
    expose:
    - "8000"
    deploy:
      resources:
        limits:
          memory: '89478485'
          cpus: 0.166666
        reservations: {}
    mem_limit: 89478485
    memswap_limit: 89478485
    cpus: 0.166666
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
    - backend
    networks:
    - telegram-tv-network
    expose:
    - "80"
    deploy:
      resources:
        limits:
          memory: '89478485'
          cpus: 0.166666
        reservations: {}
    mem_limit: 89478485
    memswap_limit: 89478485
    cpus: 0.166666
volumes:
  postgres_data:
    driver: local
  telegram_session:
    driver: local
networks:
  telegram-tv-network:
    driver: bridge
